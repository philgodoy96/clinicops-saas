services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicops}
      POSTGRES_USER: ${POSTGRES_USER:-clinicops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clinicops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-clinicops} -d ${POSTGRES_DB:-clinicops}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    image: clinicops:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command:
      [
        "uvicorn",
        "clinicops.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    env_file:
      - .env
    environment:
      CLINICOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinicops}:${POSTGRES_PASSWORD:-clinicops}@postgres:5432/${POSTGRES_DB:-clinicops}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: clinicops:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command:
      [
        "python",
        "-m",
        "clinicops.worker",
      ]
    env_file:
      - .env
    environment:
      CLINICOPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinicops}:${POSTGRES_PASSWORD:-clinicops}@postgres:5432/${POSTGRES_DB:-clinicops}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 300s

volumes:
  clinicops_postgres_data:
