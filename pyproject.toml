[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "clinicops-saas"
version = "0.1.0"
description = "Production-minded multi-tenant clinic management SaaS backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv.build-backend]
module-name = "clinicops"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "T20",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests"]
exclude = ["migrations"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["clinicops"]

[tool.coverage.report]
show_missing = true
skip_covered = true